name: Metrics

on:
  # Refresh every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # Run manually from the Actions tab
  workflow_dispatch:
  # Refresh on push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Personal Access Token (classic) stored as a repo secret.
          # Create it with `repo` + `read:user` scopes, then add it under
          # Settings > Secrets and variables > Actions as METRICS_TOKEN.
          token: ${{ secrets.METRICS_TOKEN }}

          # Commit the generated SVG back to the repo
          filename: github-metrics.svg
          output_action: commit
          committer_message: "chore: update metrics"

          # Who + base layout
          user: Amitk2108
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # Isometric contribution calendar (full year)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most used languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used, recently-used

          # Coding activity + habits
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_limit: 5
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_from: 200

          # Lines of code changed + repos/stars
          plugin_lines: yes
          plugin_stars: yes
          plugin_stars_limit: 4

          # Notable achievements
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_threshold: C
